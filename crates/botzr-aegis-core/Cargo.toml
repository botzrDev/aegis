[package]
name = "botzr-aegis-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/botzrDev/aegis"
description = "Core types and traits for Aegis — secure agent tool execution runtime."
readme = "README.md"
keywords = ["aegis", "agent", "security", "wasm"]
categories = ["development-tools", "wasm"]
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
# Pure computation, not I/O: core's "zero I/O" rule bars side effects, not
# arithmetic. `serde_json` backs the JCS canonical form (the hash input for
# every audit line); `sha2` backs the digest newtypes. Core deliberately does
# *not* depend on ed25519-dalek — it holds signature bytes, never keys.
serde_json = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
# AILAB-850: property tests for the JCS canonicalizer
# (tests/jcs_properties.rs). Declared literally rather than through
# `[workspace.dependencies]` because there is no workspace entry for proptest —
# `botzr-aegis-capability` declares it the same way.
proptest = "1"
