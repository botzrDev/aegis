[package]
name = "botzr-aegis-core"
# Independently versioned: AEG-24 added a public field to `CapabilityGrant`, a
# breaking change on the published 0.1.0 (semver minor bump for 0.x). The rest of
# the workspace stays on the shared `[workspace.package]` version.
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/botzrDev/aegis"
description = "Core types and traits for Aegis — secure agent tool execution runtime."
readme = "README.md"
keywords = ["aegis", "agent", "security", "wasm"]
categories = ["development-tools", "wasm"]
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true }

[dev-dependencies]
