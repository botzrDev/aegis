[package]
name = "botzr-aegis-capability"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/botzrDev/aegis"
rust-version.workspace = true
description = "Default-deny capability resolver and grant minting for Aegis."
readme = "README.md"
keywords = ["aegis", "agent", "security", "capabilities"]
categories = ["development-tools"]

[lints]
workspace = true

[features]
# Grant-minting helpers that exist for tests and deny-all baselines only.
test-utils = []

[dependencies]
botzr-aegis-core = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Self dev-dependency so this crate's own integration tests can reach the
# `test-utils`-gated helpers (tests/capability.rs uses `resolve_manifest`).
botzr-aegis-capability = { path = ".", features = ["test-utils"] }
criterion = { workspace = true }
proptest = "1"
tempfile = { workspace = true }

[[bench]]
name = "resolve"
harness = false
