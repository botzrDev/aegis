[package]
name = "botzr-aegis-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/botzrDev/aegis"
rust-version.workspace = true
description = "CLI for Aegis. Installed binary name: aegis."
readme = "README.md"
keywords = ["aegis", "agent", "security", "cli"]
categories = ["command-line-utilities", "development-tools"]

[lints]
workspace = true

[dependencies]
botzr-aegis-audit = { workspace = true }
botzr-aegis-capability = { workspace = true }
botzr-aegis-core = { workspace = true }
# Direct, and deliberately not reached through `botzr-aegis-runtime`: `recheck`
# re-evaluates a finished record and must not be able to pull a wasmtime engine
# into a read-only forensic path.
botzr-aegis-policy = { workspace = true }
botzr-aegis-runtime = { workspace = true }
# `aegis wrap` is a thin argv-to-`WrapConfig` shim over this crate. The relay
# lives there and only there — a second copy of the pump in the CLI would be a
# second thing to keep deadlock-free, and the one in the library is the one
# under test.
botzr-aegis-wrap = { workspace = true }
botzr-aegis-confine = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# Already a dependency above; named again so `tests/confine.rs` can build its
# profile JSON from `exec_support_paths()` — the *product's* loader set, not a
# copy. A private copy in the tests is what let the suite pass while shipped
# `--confine` could not exec anything (AILAB-628).
botzr-aegis-confine = { workspace = true }

[[bin]]
name = "aegis"
path = "src/main.rs"
