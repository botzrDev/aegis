[package]
name = "botzr-aegis-audit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/botzrDev/aegis"
rust-version.workspace = true
description = "Structured audit records for Aegis — always emitted on every exit path."
readme = "README.md"
keywords = ["aegis", "agent", "security", "audit"]
categories = ["development-tools"]

[lints]
workspace = true

[features]
# House parity with `sandbox`, `capability` and `runtime`: the place a
# test-only audit API lands, off by default so it cannot reach a production
# build.
#
# **Empty today, and honestly so.** It gates nothing, because there is nothing
# here that needs gating: the verdict types (`Verification`, `Verdict`,
# `IndeterminateReason`, `TamperedReason`, `TrustLabel`, `Position`) all carry
# public fields and public variants in a default build, so a consumer — the
# `aegis verify` formatter tests included — already constructs them with a
# struct literal. Do not describe this feature as making those types
# constructible; it does not, and a doc that said so would be describing a seal
# nobody has built.
#
# Not the option ADR-0012 rejected. That was a gated, crate-private *sink* seam
# proposed instead of declared Retention; Retention shipped and stands. This
# gates no sink and replaces no decision.
test-utils = []

[dependencies]
botzr-aegis-core = { workspace = true }
# The private key lives here, not in core: core holds signature *bytes* and
# cannot verify anything, which keeps the crypto dependency off every crate
# that only reads records.
ed25519-dalek = { workspace = true }
# Key *generation* only (`keyfile.rs`): 32 bytes from the OS CSPRNG. Kept
# separate from ed25519-dalek's `rand` feature so the dalek pin stays minimal.
getrandom = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
# Tests and benches only. No production sink creates a temp directory since
# AILAB-702: the default Chain is in-memory and Volatile, and the only file sink
# is opened at a path the caller names.
tempfile = { workspace = true }

[[bench]]
name = "emission"
harness = false

[[bench]]
name = "sign"
harness = false
