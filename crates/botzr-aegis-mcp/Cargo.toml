[package]
name = "botzr-aegis-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/botzrDev/aegis"
rust-version.workspace = true
description = "Phase 2 MCP stdio gateway for Aegis — tools/call → Runtime pipeline → audit JSONL."
readme = "README.md"
keywords = ["aegis", "agent", "security", "mcp"]
categories = ["development-tools"]
# Ship the Model A smoke fixture so package verification does not need the
# monorepo `tests/fixtures/` tree.
include = [
    "src/**/*",
    "fixtures/**/*",
    "Cargo.toml",
    "README.md",
    "DECISIONS.md",
]

[lints]
workspace = true

[dependencies]
botzr-aegis-capability = { workspace = true }
botzr-aegis-core = { workspace = true }
# Direct: `execute_tool_call` takes a `PolicyRequest`, so the bridge names the
# Decision Axes it asserts (none beyond tool identity) rather than having them
# chosen for it (AILAB-708).
botzr-aegis-policy = { workspace = true }
botzr-aegis-runtime = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Test-only: a persistent audit sink needs a provisioned signing key and has no
# dev-key fallback (AILAB-620), so the tests mint one with `generate_signing_key`.
# The gateway itself never links the audit crate — it goes through `RuntimeBuilder`.
botzr-aegis-audit = { workspace = true }
# Test-only, and deliberately in *this* package: the interop AC (AILAB-625) puts
# `aegis wrap` in front of a real, unmodified stdio MCP server, and
# `CARGO_BIN_EXE_botzr-aegis-mcp` only resolves for tests of the package that
# declares the bin. The gateway itself never links wrap — the dependency points
# one way, and wrap must stay able to interpose on any server, not just ours.
botzr-aegis-wrap = { workspace = true }
tempfile = { workspace = true }

[[bin]]
name = "botzr-aegis-mcp"
path = "src/main.rs"
