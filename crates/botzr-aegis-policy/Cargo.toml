[package]
name = "botzr-aegis-policy"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/botzrDev/aegis"
rust-version.workspace = true
description = "YAML policy engine for Aegis — parsed once, synchronous evaluation."
readme = "README.md"
keywords = ["aegis", "agent", "security", "policy"]
categories = ["development-tools"]

[lints]
workspace = true

[dependencies]
botzr-aegis-core = { workspace = true }
arc-swap = { workspace = true }
serde = { workspace = true }
serde_norway = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
# Tests only. `AuditRecord::schema_version` is sealed against callers, so the
# only way to hold a foreign-schema record — and the only way a real recheck
# ever meets one — is to deserialize it.
serde_json = { workspace = true }
tempfile = { workspace = true }

[[bench]]
name = "policy_eval"
harness = false
