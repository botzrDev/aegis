[package]
name = "botzr-aegis-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/botzrDev/aegis"
rust-version.workspace = true
description = "Aegis runtime orchestrator — POLICY → CAPABILITY → SANDBOX → AUDIT."
readme = "README.md"
keywords = ["aegis", "agent", "security", "runtime"]
categories = ["development-tools"]

[lints]
workspace = true

[features]
# Raw-WASM-fixture registration for the deny-suite and resource-cap tests.
# Off by default; pulls the sandbox's matching gate so the fixture path is
# genuinely absent from a production build rather than merely undocumented.
test-utils = ["botzr-aegis-sandbox/test-utils"]

[dependencies]
botzr-aegis-audit = { workspace = true }
botzr-aegis-capability = { workspace = true }
botzr-aegis-core = { workspace = true }
botzr-aegis-policy = { workspace = true }
botzr-aegis-sandbox = { workspace = true }
cap-std = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
# `Handle::try_current` (the nested-runtime refusal on the sync entry points)
# and `block_on` on the sandbox engine's owned runtime. Workspace features are
# `rt` + `macros`; the multi-thread scheduler is a dev-dependency only.
tokio = { workspace = true }

[dev-dependencies]
# Self dev-dependency so this crate's own integration tests
# (tests/registration.rs, tests/resource_orchestrator.rs) can reach the
# `test-utils`-gated fixture API.
botzr-aegis-runtime = { path = ".", features = ["test-utils"] }
botzr-aegis-audit = { workspace = true }
criterion = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
# Tests only: `#[tokio::test(flavor = "multi_thread")]` is how the sync entries'
# nested-runtime refusal is exercised. Not a feature of the published crate —
# no production path needs the multi-thread scheduler.
tokio = { workspace = true, features = ["rt-multi-thread"] }

[[bench]]
name = "hot_path"
harness = false