[package]
name = "botzr-aegis-sandbox"
# Independently versioned: crates.io 0.1.0 still depends on core ^0.1.0.
# Republish against core 0.2.0 so runtime (and downstream) can verify.
version = "0.1.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/botzrDev/aegis"
rust-version.workspace = true
description = "wasmtime sandbox for Aegis — component-model-native (wasip2)."
readme = "README.md"
keywords = ["aegis", "agent", "security", "wasm", "sandbox"]
categories = ["development-tools", "wasm"]
# Ship in-crate WIT so `cargo publish` verifies without the monorepo root tree.
include = [
    "src/**/*",
    "wit/**/*",
    "Cargo.toml",
    "README.md",
    "INTEGRATION.md",
]

[lints]
workspace = true

[dependencies]
botzr-aegis-core = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
wasmtime = { workspace = true }
wasmtime-wasi = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }
