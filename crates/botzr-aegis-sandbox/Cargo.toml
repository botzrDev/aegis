[package]
name = "botzr-aegis-sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/botzrDev/aegis"
rust-version.workspace = true
description = "wasmtime sandbox for Aegis — component-model-native (wasip2)."
readme = "README.md"
keywords = ["aegis", "agent", "security", "wasm", "sandbox"]
categories = ["development-tools", "wasm"]
# Ship in-crate WIT so `cargo publish` verifies without the monorepo root tree.
include = [
    "src/**/*",
    "wit/**/*",
    "Cargo.toml",
    "README.md",
    "INTEGRATION.md",
]

[lints]
workspace = true

[features]
# Raw-component fixture APIs used by the deny-suite and resource-metering
# tests. Off by default: a production consumer has no business instantiating
# a component that never declared the WIT `tool` world.
test-utils = []

[dependencies]
botzr-aegis-core = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
wasmtime = { workspace = true }
wasmtime-wasi = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
# Self dev-dependency so this crate's own integration tests (tests/sandbox.rs)
# can reach the `test-utils`-gated fixture API. Dev-dependency cycles on the
# same package are explicitly legal in cargo.
botzr-aegis-sandbox = { path = ".", features = ["test-utils"] }
tempfile = { workspace = true }
tokio = { workspace = true }
