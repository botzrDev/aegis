[workspace]
resolver = "2"
# Sibling cargo project: libFuzzer needs nightly; the workspace pins 1.86
# with unsafe_code = forbid. Never promote fuzz to members.
exclude = ["fuzz"]
members = [
    "crates/botzr-aegis-core",
    "crates/botzr-aegis-policy",
    "crates/botzr-aegis-capability",
    "crates/botzr-aegis-sandbox",
    "crates/botzr-aegis-audit",
    "crates/botzr-aegis-runtime",
    "crates/botzr-aegis-mcp",
    "crates/botzr-aegis-cli",
    "crates/botzr-aegis-wrap",
    "tests/integration",
    "tests/deny-suite",
    "tests/api-surface",
    "tests/fixtures/echo-tool",
    "tests/fixtures/damage-bot",
    "tests/fixtures/path-detector",
    "tests/adversarial-demo",
    "tests/stage2-demo",
    "tests/stress",
    "examples/damage-bot-demo",
    "examples/dreamd-poc",
    "examples/sandbox-consumer",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/botzrDev/aegis"
rust-version = "1.86"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
botzr-aegis-audit = { path = "crates/botzr-aegis-audit", version = "0.3.0" }
botzr-aegis-capability = { path = "crates/botzr-aegis-capability", version = "0.3.0" }
botzr-aegis-cli = { path = "crates/botzr-aegis-cli", version = "0.3.0" }
botzr-aegis-core = { path = "crates/botzr-aegis-core", version = "0.3.0" }
botzr-aegis-policy = { path = "crates/botzr-aegis-policy", version = "0.3.0" }
botzr-aegis-runtime = { path = "crates/botzr-aegis-runtime", version = "0.3.0" }
botzr-aegis-sandbox = { path = "crates/botzr-aegis-sandbox", version = "0.3.0" }
botzr-aegis-mcp = { path = "crates/botzr-aegis-mcp", version = "0.3.0" }
botzr-aegis-wrap = { path = "crates/botzr-aegis-wrap", version = "0.3.0" }
anyhow = "1"
arc-swap = "1"
cap-std = "3"
criterion = { version = "0.5", features = ["html_reports"] }
# AILAB-619: ed25519 signatures over the canonical (JCS) form of signed audit
# lines. BSD-3-Clause, already in deny.toml's allow list; MSRV 1.85 <= 1.86.
# Key *lifecycle* (location, permissions, first-run generation) is AILAB-620 —
# this pin only buys the signing primitive.
ed25519-dalek = { version = "3", default-features = false, features = ["fast"] }
# AILAB-620: OS entropy for `aegis keygen` — 32 seed bytes, nothing else.
# MIT OR Apache-2.0, both already in deny.toml's allow list; MSRV 1.63 <= 1.86.
# Already in the tree transitively (via rand_core); this makes the audit crate's
# use of it a declared, direct dependency rather than a borrowed one.
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros"] }
wasmtime = { version = "36", features = ["component-model", "async"] }
wasmtime-wasi = "36"
wit-bindgen = "0.44"
