name: Advisory audit

on:
  schedule:
    # Weekly, Wednesday 06:00 UTC — offset from fuzz-smoke (Monday 06:00 UTC).
    # Advisories-only so new RUSTSEC entries surface without a code change.
    - cron: "0 6 * * 3"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: cargo deny (advisories only)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories
