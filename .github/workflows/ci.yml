name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        run: rustup target add wasm32-wasip2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  governance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: governance
    services:
      # Real pgvector — the learning-store tests exercise the vector(16) column
      # and the `<=>` cosine operator, so there is no SQLite substitute.
      # Credentials are disposable CI values, never a production database.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aegis_governance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Only the pgvector integration tests read this. The app's own default
      # store stays in-process during pytest, so CI and laptop runs match.
      AEGIS_GOVERNANCE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aegis_governance_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Migrate learning store
        # Schema changes are explicit and operator-run; the app never migrates
        # on import. Scoped to this step only.
        env:
          AEGIS_GOVERNANCE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aegis_governance_test
        run: python -m aegis_governance.learning_postgres migrate

      - name: Pytest
        run: python -m pytest -q

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: cargo deny (advisories, licenses, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust 1.86 (MSRV)
        # Explicit toolchain — do not rely on the runner default or
        # rust-toolchain.toml resolution. Must stay in sync with `rust-version`
        # in the workspace Cargo.toml.
        run: |
          rustup toolchain install 1.86 --profile minimal
          rustup target add wasm32-wasip2 --toolchain 1.86

      - name: Check workspace on MSRV
        run: cargo +1.86 check --workspace --locked
