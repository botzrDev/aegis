name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'spec/SPEC.md'
      - 'SECURITY.md'
      # Every file under results/ is `{{#include}}`d by docs/benchmarks.md, so
      # each one is a book page. Globbed rather than listed: a new results file
      # that silently stops republishing the book is how a missed target ends up
      # documented everywhere except the site.
      - 'benches/results/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# GITHUB_TOKEN needs `pages` and `id-token` to publish; everything else stays read-only.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. In-flight publishes are allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install mdBook 0.5.4
        # Same pinned tarball and digest as the `docs` gate in ci.yml — the
        # published site must be the artifact CI already proved builds.
        run: |
          curl -sSL -o mdbook.tgz \
            https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-musl.tar.gz
          echo "5222beabd3e37dc5be0d18ff99b79058469354db5c220153a1b92db5ba12be89  mdbook.tgz" \
            | sha256sum -c -
          tar -xzf mdbook.tgz
          sudo mv mdbook /usr/local/bin/

      - name: Build docs book
        working-directory: docs
        run: mdbook build --dest-dir ../target/book

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
